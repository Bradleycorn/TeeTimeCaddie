nsexceptionkt = { module="com.rickclephas.kmp:nsexception-kt-core", version.ref="nsexceptionkt"}

[bundles]
accompanist = [
    "accompanist-systemui",
    "accompanist-navigation"
]

android-test = [
    "androidx-test-espresso",
    "androidx-test-junit",
    "androidx-compose-ui-test"
]

android-debug = [
    "androidx-compose-ui-tooling-debug",
    "androidx-compose-ui-manifest"
]

compose = [
    "androidx-compose-ui-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-navigation-compose",
    "androidx-navigation-hilt",
    "androidx-navigation3-runtime",
    "androidx-navigation3-ui",
    "androidx-navigation3-viewmodel",
    "androidx-hilt-viewmodel"
]

firebase = [
    "firebase-analytics",
    "firebase-auth",
    "firebase-config",
    "firebase-crashlytics",
    "firebase-performance"
]

ktor-common = [
    "ktor-core",
    "ktor-serialization",
    "ktor-contentNegotiation",
]

