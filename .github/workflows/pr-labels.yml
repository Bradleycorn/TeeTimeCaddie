# Place at: .github/workflows/pr-labels.yml

name: PR Labels

on:
  pull_request:
    # Only PRs targeting main or a release branch
    branches:
      - main
      - 'release/**'
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7

  require-label:
    needs: label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    env:
      # A PR must have at least one of these labels
      REQUIRED_LABELS: "Epic Story Defect"
    steps:
      - name: Check for a release label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Read labels fresh; the event payload predates the label job
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')

          for required in $REQUIRED_LABELS; do
            if grep -qx "$required" <<< "$labels"; then
              echo "Found label: $required"
              exit 0
            fi
          done

          echo "::error::This PR needs one of these labels: $REQUIRED_LABELS"
          exit 1
